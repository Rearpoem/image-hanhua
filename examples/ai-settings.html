<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="PAIRING_TOKEN"><title>图片汉化 · API 配置</title><link rel="stylesheet" href="/ui.css"></head><body><main class="settings"><header><span class="mark">译</span><div><h1>AI 翻译配置</h1><div class="sub">结合网页上下文，让中文更自然</div></div></header><p>支持 OpenAI 兼容的 Chat Completions 接口。保存不会调用 API；在翻译面板选择“AI 上下文”后才会发送网页正文和图片识别文字，可能产生费用。图片仍在本机识别，不上传原图。</p><form id="config"><label class="field" for="endpoint">完整 API 地址</label><input id="endpoint" type="text" placeholder="https://你的接口域名/v1/chat/completions" maxlength="500"><label class="field" for="model">模型名称</label><input id="model" type="text" placeholder="填写服务商提供的模型名称" maxlength="120"><label class="field" for="key">API 密钥</label><input id="key" type="password" autocomplete="new-password" placeholder="未设置；无需密钥的接口可留空"><p id="key-state" class="note"></p><label class="check"><input id="clear" type="checkbox">清除已保存的密钥</label><label class="field" for="style">翻译风格</label><textarea id="style" maxlength="1000"></textarea><label class="field" for="limit">每类上下文最多字符数</label><input id="limit" type="number" min="2000" max="60000" step="1000" value="24000"><p class="note">正文和整页图片文字分别按此上限截取。超长页面分批翻译，每批最多 12 个文字框；目前最多 1000 个文字框。只使用当前已加载的图片。</p><label class="check"><input id="json" type="checkbox">启用 JSON 输出模式（仅适用于支持此参数的接口；DeepSeek 官方接口自动启用）</label><div class="row"><button class="primary" type="submit">保存配置</button><a href="/demo">打开体验页</a></div><div id="status" role="status" aria-live="polite" class="status-message"></div></form><p class="note">密钥保存在本机 runtime/ai-config.json 中，仅当前用户可读写，未加密。重开此页不会显示已保存的密钥。网页内容可能含私人信息，使用前请确认配置的服务商可信。</p></main><script src="/ai-settings.js"></script></body></html>
